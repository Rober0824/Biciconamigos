<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --navy:#0A1128;
    --navy-2:rgba(255,255,255,0.06);
    --navy-border:rgba(255,255,255,0.1);
    --pink:#D4537E;
    --pink-dark:#4B1528;
    --pink-mid:#72243E;
    --text:#ffffff;
    --text-dim:rgba(255,255,255,0.55);
    --text-dim2:rgba(255,255,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;padding:24px 12px;background:#EEEEF0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;}
  button{cursor:pointer;font-family:inherit;border:none;}
  input,select,textarea{font-family:inherit;}
  .app{max-width:420px;width:100%;height:calc(100vh - 48px);background:#F4F4F5;border-radius:20px;padding:10px;display:flex;}
  .phone{background:var(--navy);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;}
  @media (max-width:480px){
    body{padding:0;}
    .app{max-width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;}
    .phone{border-radius:0;}
  }
  .header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--navy-border);min-height:76px;flex-shrink:0;}
  .logo-img{height:64px;width:auto;display:block;}
  .wordmark-img{height:22px;width:auto;display:block;margin-left:2px;}
  .header-title{font-weight:600;font-size:15px;color:var(--text);}
  .header-user{margin-left:auto;font-size:12px;color:var(--text-dim);cursor:pointer;}
  .content{flex:1;padding:14px 16px;overflow-y:auto;}
  .card{background:var(--navy-2);border-radius:10px;padding:12px;margin-bottom:10px;}
  .label-sm{font-size:11px;color:var(--text-dim);margin:0 0 4px;text-transform:uppercase;letter-spacing:0.03em;}
  .ts{font-size:12px;}
  .section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin:0 0 8px;}
  .btn-primary{background:var(--pink);color:var(--pink-dark);font-weight:600;font-size:13px;padding:9px 14px;border-radius:8px;}
  .btn-ghost{background:transparent;color:var(--text-dim);font-size:13px;padding:9px 14px;border-radius:8px;border:0.5px solid var(--navy-border);}
  .btn-dark{background:var(--navy);color:#fff;font-size:12px;padding:6px 12px;border-radius:8px;}
  input,textarea,select{background:rgba(255,255,255,0.08);border:0.5px solid var(--navy-border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;width:100%;}
  input::placeholder,textarea::placeholder{color:var(--text-dim2);}
  .nav{display:flex;border-top:0.5px solid var(--navy-border);flex-shrink:0;}
  .navbtn{flex:1;background:transparent;padding:12px 0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .navbtn.active{color:var(--pink);}
  .navicon{width:22px;height:22px;}
  .no-scrollbar{scrollbar-width:none;-ms-overflow-style:none;}
  #ride-map{position:relative;}
  .map-attrib-btn{position:absolute;bottom:4px;right:4px;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,0.75);color:#333;font-size:10px;font-style:italic;font-weight:700;font-family:Georgia,serif;line-height:16px;text-align:center;cursor:pointer;z-index:5;user-select:none;}
  .map-attrib-text{position:absolute;bottom:24px;right:4px;max-width:220px;background:rgba(20,20,20,0.85);color:#fff;font-size:9px;padding:5px 7px;border-radius:6px;z-index:5;display:none;line-height:1.3;}
  .maplibregl-ctrl-bottom-right{bottom:2px !important;right:2px !important;}
  .no-scrollbar::-webkit-scrollbar{display:none;height:0;}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--navy-border);}
  .row:last-child{border-bottom:none;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--navy-2);flex-shrink:0;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .stat-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
  .stat-box{background:var(--navy-2);border-radius:10px;padding:10px 12px;}
  .stat-val{font-size:18px;font-weight:600;margin:0;color:var(--text);text-align:center;}
  .hint{font-size:12px;color:var(--text-dim);text-align:center;padding:20px 10px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--navy);border-radius:16px 16px 0 0;padding:18px 16px 22px;width:100%;max-width:420px;}
  .modal h3{color:#fff;font-size:15px;margin:0 0 12px;}
  .field{margin-bottom:10px;}
  .field label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;}
  .fab{position:absolute;bottom:70px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--pink);color:var(--pink-dark);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
  .auth-box{padding:40px 20px;}
  .auth-box h2{color:#fff;font-size:18px;margin-bottom:4px;}
  .auth-box p.sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  .err{color:#ff8fa3;font-size:12px;margin-top:6px;}
  .tag{display:inline-block;font-size:11px;background:var(--navy-2);color:var(--text-dim);padding:3px 8px;border-radius:6px;margin-right:4px;}
</style>
</head>

    <div class="auth-box">
      <h2>Entrar al club</h2>
      <p class="sub">Usa tu email para acceder o crear cuenta.</p>
      <div class="field"><label>Email</label><input id="auth-email" type="email" placeholder="tú@email.com"></div>
      <div class="field"><label>Contraseña</label><input id="auth-pass" type="password" placeholder="••••••••"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn-primary" style="flex:1;" onclick="doSignIn()">Entrar</button>
        <button class="btn-ghost" style="flex:1;" onclick="doSignUp()">Crear cuenta</button>
      </div>
      <div id="auth-err" class="err"></div>
    </div>
  `;
}

async function doSignIn(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) document.getElementById('auth-err').textContent = error.message;
}

async function doSignUp(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const { error } = await sb.auth.signUp({ email, password });
  if (error) { document.getElementById('auth-err').textContent = error.message; return; }
  document.getElementById('auth-err').style.color = '#8fe0a8';
  document.getElementById('auth-err').textContent = 'Cuenta creada. Ya puedes entrar.';
}

async function signOut(){ await sb.auth.signOut(); }

function certIcon(code, size){
  size = size || 15;
  if (CERT_IMAGES[code]) {
    return `<img src="${CERT_IMAGES[code]}" style="height:${size}px;width:auto;vertical-align:-3px;">`;
  }
  if (code === 'fotografo'){
    return svgIcon('camera','var(--pink)',size);
  }
  if (code === 'companero'){
    return svgIcon('heart','var(--pink)',size);
  }
  return '';
}

function svgIcon(name, color, size){
  size = size || 15;
  return `<svg width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="1.7" style="flex-shrink:0;margin-top:1px;"><use href="#ic-${name}" width="${size}" height="${size}"/></svg>`;
}

async function loadChallengeWithMembers(ch, allParts){
  const { data: progressRows } = await sb.from('challenge_progress')
    .select('user_id, profiles(full_name, nickname)')
    .eq('challenge_id', ch.id);

  const joinedIds = (progressRows||[]).map(p => p.user_id);
  const nameByUser = {};
  (progressRows||[]).forEach(p => { nameByUser[p.user_id] = dn(p.profiles) || '—'; });

  const members = joinedIds.map(uid => {
    let current = 0;
    (allParts||[]).forEach(p => {
      if (p.user_id !== uid) return;
      const r = p.rides;
      if (!r || r.status !== 'finalizada') return;
      if (r.ride_date < ch.start_date || r.ride_date > ch.end_date) return;
      current += ch.metric === 'km' ? (r.distance_km||0) : ch.metric === 'desnivel' ? (r.elevation_m||0) : 0;
    });
    return { user_id: uid, name: nameByUser[uid] || '—', current };
  }).sort((a,b) => b.current - a.current);

  const total = members.reduce((s,m) => s + m.current, 0);
  const joined = joinedIds.includes(currentUser.id);
  const mine = members.find(m => m.user_id === currentUser.id);

  return { ...ch, members, total, joined, myCurrent: mine ? mine.current : 0 };
}

async function getOpenSponsorVotes(){
  const nowIso = new Date().toISOString();
  const { data: requests } = await sb.from('sponsorship_change_requests')
    .select('*, requester:requester_id(full_name, nickname), proposed:proposed_sponsor_id(full_name, nickname)')
    .eq('vote_enabled', true)
    .eq('status', 'pendiente')
    .gt('vote_ends_at', nowIso);
  if (!requests || !requests.length) return [];

  const ids = requests.map(r => r.id);
  const { data: votes } = await sb.from('sponsorship_request_votes').select('*').in('request_id', ids);

  return requests.map(r => {
    const rVotes = (votes||[]).filter(v => v.request_id === r.id);
    const aFavor = rVotes.filter(v => v.vote === 'a_favor').length;
    const enContra = rVotes.filter(v => v.vote === 'en_contra').length;
    const myVote = rVotes.find(v => v.voter_id === currentUser.id);
    return { ...r, aFavor, enContra, myVote: myVote ? myVote.vote : null };
  });
}

function formatCountdown(endsAtIso){
  const diffMs = new Date(endsAtIso).getTime() - Date.now();
  if (diffMs <= 0) return 'Votación cerrada';
  const hours = Math.floor(diffMs / 3600000);
  const mins = Math.floor((diffMs % 3600000) / 60000);
  if (hours >= 24){
    const days = Math.floor(hours / 24);
    return `Quedan ${days} día${days!==1?'s':''}`;
  }
  return `Quedan ${hours}h ${mins}min`;
}

async function getActiveChallenge(){
  const today = new Date().toISOString().slice(0,10);
  const { data: challenges } = await sb.from('challenges')
    .select('*')
    .eq('status', 'aprobado')
    .lte('start_date', today)
    .gte('end_date', today)
    .order('start_date', { ascending: false })
    .limit(1);
  if (!challenges || !challenges.length) return null;

  const { data: parts } = await sb.from('ride_participants')
    .select('user_id, rides(distance_km, elevation_m, status, ride_date)')
    .eq('status', 'confirmado');

  return await loadChallengeWithMembers(challenges[0], parts);
}

    const n = nextRides.length;
    const slides = nextRides.map((r,i) => {
      const mine = (r.ride_participants||[]).find(p => p.user_id === currentUser.id);

async function voteSponsorRequest(requestId, vote){
  await sb.from('sponsorship_request_votes').upsert({ request_id: requestId, voter_id: currentUser.id, vote }, { onConflict: 'request_id,voter_id' });
  renderInicio();
}

async function setAttendance(rideId, status){
  await sb.from('ride_participants').upsert({ ride_id: rideId, user_id: currentUser.id, status }, { onConflict: 'ride_id,user_id' });
  renderInicio();
}

// ---------------- CALENDARIO ----------------
let selectedRideId = null;
let calMonthOffset = 0; // 0 = mes actual, -1 = anterior, +1 = siguiente
let calDayIndex = {};

async function renderCalendario(){
  if (selectedRideId){ renderRideDetail(selectedRideId); return; }

  const content = document.getElementById('content');
  content.innerHTML = `<div class="hint">Cargando...</div>`;
  const { data: rides, error } = await sb.from('rides')
    .select('*, ride_participants(status)')
    .order('ride_date', { ascending: false })
    .limit(200);

  if (error){ content.innerHTML = `<p class="hint">Error cargando salidas: ${error.message}</p>`; return; }

  const statusLabel = { programada:'Programada', en_curso:'En curso', finalizada:'Finalizada', archivada:'Archivada' };
  const today = new Date().toISOString().slice(0,10);
  const upcoming = (rides||[]).filter(r => r.ride_date >= today || r.status === 'programada' || r.status === 'en_curso')
    .sort((a,b)=> a.ride_date.localeCompare(b.ride_date));
  const past = (rides||[]).filter(r => !upcoming.includes(r))
    .sort((a,b)=> b.ride_date.localeCompare(a.ride_date));

  function rideCard(r){
    const confirmed = (r.ride_participants||[]).filter(p=>p.status==='confirmado').length;
    return `
      <div class="card" style="cursor:pointer;" onclick="openRideDetail('${r.id}')">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:13px;font-weight:600;color:#fff;">${escapeHtml(r.name)}</span>
          <span class="tag" style="margin:0;">${statusLabel[r.status]||r.status}</span>
        </div>
        <p style="font-size:12px;color:var(--text-dim);margin:6px 0 0;">
          ${formatDate(r.ride_date)}${r.distance_km? ' · '+r.distance_km+' km':''} · ${confirmed} confirmados
        </p>
      </div>
    `;
  }

  content.innerHTML = `
    ${renderMonthGrid(rides||[])}
    <p class="section-title">Próximas</p>
    ${upcoming.length ? upcoming.map(rideCard).join('') : '<p class="hint">Nada programado. Toca + para crear una salida.</p>'}
    <p class="section-title" style="margin-top:14px;">Pasadas</p>
    ${past.length ? past.map(rideCard).join('') : '<p class="hint">Todavía no hay historial.</p>'}
  `;
}

function renderMonthGrid(rides){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + calMonthOffset, 1);
  const year = base.getFullYear(), month = base.getMonth();
  const monthLabel = base.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

  const ridesByDate = {};
  rides.forEach(r => {
    if (!ridesByDate[r.ride_date]) ridesByDate[r.ride_date] = [];
    ridesByDate[r.ride_date].push(r);
  });
  calDayIndex = ridesByDate;

  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7; // lunes = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div></div>`;
  for (let d = 1; d <= daysInMonth; d++){

let currentRoutePts = [];
let routeAnimTimer = null;
let routeMarkerEl = null;
let routeSampled = [];
let routeAnimIndex = 0;
let routeAnimSpeed = 1;

function calcBearing(a, b){
  const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
  const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
  const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) - Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

function makeFlagEl(color){
  const div = document.createElement('div');
  div.innerHTML = `<svg width="22" height="28" viewBox="0 0 24 30"><path d="M12 29C12 29 2 17 2 10.5C2 4.7 6.5 0 12 0C17.5 0 22 4.7 22 10.5C22 17 12 29 12 29Z" fill="${color}" stroke="#0A1128" stroke-width="1"/><circle cx="12" cy="10.5" r="3.8" fill="#0A1128"/></svg>`;
  div.style.transform = 'translateY(2px)';
  return div;
}

function initRideMap(ride){
  const el = document.getElementById('ride-map');
  if (!el || typeof maplibregl === 'undefined') return;
  if (rideMapInstance){ rideMapInstance.remove(); rideMapInstance = null; }
  if (routeAnimTimer){ clearInterval(routeAnimTimer); routeAnimTimer = null; }
  routeMarkerEl = null;
  currentRoutePts = [];

  const pts = ride.map_geojson?.points || [];
  const hasRoute = pts.length > 1;
  const center = hasRoute ? [pts[Math.floor(pts.length/2)].lng, pts[Math.floor(pts.length/2)].lat]
    : (ride.meeting_lat ? [ride.meeting_lng, ride.meeting_lat] : [-3.7038, 40.4168]);

  const coords = hasRoute ? pts.map(p => [p.lng, p.lat]) : [];

  const map = new maplibregl.Map({
    container: el,
    style: {
      version: 8,
      sources: {
        'sat': {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256,
          maxzoom: 18,
          attribution: 'Imagery © Esri'
        },
        'labels': {
          type: 'raster',
          tiles: ['https://basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}@2x.png'],
          tileSize: 256,
          maxzoom: 20,
          attribution: '© OpenStreetMap contributors © CARTO'
        },
        'terrain-src': {
          type: 'raster-dem',
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          tileSize: 256,
          encoding: 'terrarium',
          maxzoom: 15,
          attribution: 'Terrain data © Mapzen'
        }
      },
      layers: [
        { id: 'sat-layer', type: 'raster', source: 'sat' },
        { id: 'labels-layer', type: 'raster', source: 'labels' }
      ],
      terrain: { source: 'terrain-src', exaggeration: 1.4 }
    },
    center: center,
    zoom: hasRoute ? 12 : (ride.meeting_lat ? 12 : 5),
    pitch: hasRoute ? 55 : 0,
    bearing: 0,
    attributionControl: false,
    dragRotate: true
  });
  rideMapInstance = map;

  map.on('load', () => {
    if (hasRoute){
      currentRoutePts = pts;

      map.addSource('route-full', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: coords } } });
      map.addLayer({ id: 'route-full-line', type: 'line', source: 'route-full',
        paint: { 'line-color': '#D4537E', 'line-width': 3, 'line-opacity': 0.28 } });

      map.addSource('route-trace', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [coords[0]] } } });
      map.addLayer({ id: 'route-trace-line', type: 'line', source: 'route-trace',
        paint: { 'line-color': '#D4537E', 'line-width': 4 } });

      new maplibregl.Marker({ element: makeFlagEl('#8fe0a8'), anchor: 'bottom' }).setLngLat(coords[0]).addTo(map);
      new maplibregl.Marker({ element: makeFlagEl('#D4537E'), anchor: 'bottom' }).setLngLat(coords[coords.length-1]).addTo(map);

      const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
      map.fitBounds(bounds, { padding: 30, pitch: 55, duration: 0 });

      const chart = document.getElementById('elev-chart');
      if (chart){
        const elevs = pts.map(p=>p.ele).filter(e=>e!=null);
        if (elevs.length){
          const min = Math.min(...elevs), max = Math.max(...elevs) || 1;
          const w = 300, h = 36;
          const step = w / (elevs.length - 1);
          const path = elevs.map((e,i) => `${i===0?'M':'L'}${(i*step).toFixed(1)},${(h - ((e-min)/(max-min||1))*h).toFixed(1)}`).join(' ');
          chart.setAttribute('viewBox', `0 0 ${w} ${h}`);
          chart.innerHTML = `<path d="${path}" stroke="#ED93B1" stroke-width="1.5" fill="none"/>`;
        }
      }
    } else if (ride.meeting_lat){
      new maplibregl.Marker({ element: makeFlagEl('#D4537E'), anchor: 'bottom' }).setLngLat(center).addTo(map);
    }
  });
}

function setPlaybackSpeed(speed){
  routeAnimSpeed = speed;
  ['1','2','3'].forEach(s => {
    const b = document.getElementById('speed-btn-'+s);
    if (b) b.style.background = (Number(s)===speed) ? 'var(--pink)' : '';
    if (b) b.style.color = (Number(s)===speed) ? 'var(--pink-dark)' : '';
  });
  if (routeAnimTimer){
    clearInterval(routeAnimTimer);
    routeAnimTimer = startRouteInterval();
  }
}

function angleDiff(a, b){
  let d = (b - a) % 360;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  return d;
}

let smoothedBearing = 0;

function startRouteInterval(){
  const btn = document.getElementById('route-play-btn');
  return setInterval(() => {
    routeAnimIndex++;
    if (routeAnimIndex >= routeSampled.length){
      clearInterval(routeAnimTimer);
      routeAnimTimer = null;
      if (btn) btn.innerHTML = '▶ Reproducir ruta';
      return;
    }
    const p = routeSampled[routeAnimIndex];
    const lookaheadIdx = Math.min(routeAnimIndex + 6, routeSampled.length - 1);
    const behindIdx = Math.max(0, routeAnimIndex - 6);
    const lngLat = [p.lng, p.lat];
    const traced = routeSampled.slice(0, routeAnimIndex+1).map(pt => [pt.lng, pt.lat]);
    rideMapInstance.getSource('route-trace').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: traced } });
    if (routeMarkerEl) routeMarkerEl.setLngLat(lngLat);

    const targetBearing = calcBearing(routeSampled[behindIdx], routeSampled[lookaheadIdx]);
    smoothedBearing = (smoothedBearing + angleDiff(smoothedBearing, targetBearing) * 0.08 + 360) % 360;

    rideMapInstance.easeTo({ center: lngLat, bearing: smoothedBearing, pitch: 55, zoom: rideMapInstance.getZoom(), duration: 180 / routeAnimSpeed, easing: t => t });
  }, 180 / routeAnimSpeed);
}

function toggleRoutePlayback(){
  const btn = document.getElementById('route-play-btn');
  if (routeAnimTimer){
    clearInterval(routeAnimTimer);
    routeAnimTimer = null;
    if (btn) btn.innerHTML = '▶ Reproducir ruta';
    return;
  }
  if (!rideMapInstance || !currentRoutePts.length) return;

  const steps = Math.min(180, currentRoutePts.length);
  routeSampled = [];
  for (let k = 0; k < steps; k++){
    routeSampled.push(currentRoutePts[Math.floor(k * (currentRoutePts.length - 1) / (steps - 1))]);
  }
  routeAnimIndex = 0;
  smoothedBearing = calcBearing(routeSampled[0], routeSampled[Math.min(6, routeSampled.length-1)]);

  if (routeMarkerEl) routeMarkerEl.remove();
  const dotEl = document.createElement('div');
  dotEl.style.cssText = 'width:16px;height:16px;border-radius:50%;background:#D4537E;border:2px solid #fff;box-shadow:0 0 8px rgba(0,0,0,0.7);';
  routeMarkerEl = new maplibregl.Marker({ element: dotEl }).setLngLat([routeSampled[0].lng, routeSampled[0].lat]).addTo(rideMapInstance);
  rideMapInstance.getSource('route-trace').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[routeSampled[0].lng, routeSampled[0].lat]] } });

  if (btn) btn.innerHTML = '⏸ Detener';
  routeAnimTimer = startRouteInterval();
}

async function uploadRideGpx(event, rideId){
  const file = event.target.files[0];
  if (!file) return;
  const errBox = document.getElementById('gpx-upload-err');
  errBox.textContent = '';

  const gpxText = await file.text();
  const parsed = parseGPX(gpxText);
  if (!parsed){ errBox.textContent = 'No se han podido leer puntos de ruta en ese archivo.'; return; }

  const path = `${rideId}/track.gpx`;
  const { error: upErr } = await sb.storage.from('gpx-files').upload(path, file, { upsert: true, contentType: 'application/gpx+xml' });
  if (upErr){ errBox.textContent = 'Error al subir el archivo: ' + upErr.message; return; }

  const { data: pub } = sb.storage.from('gpx-files').getPublicUrl(path);
  await sb.from('rides').update({
    gpx_url: pub.publicUrl,
    map_geojson: { points: parsed.points },
    distance_km: Math.round(parsed.distanceKm * 10) / 10,
    elevation_m: Math.round(parsed.elevGain)
  }).eq('id', rideId);

  renderRideDetail(rideId);
}

function mentionify(text, participants){
  const names = (participants||[]).map(p => dn(p.profiles)).filter(Boolean).sort((a,b)=>b.length-a.length);
  let out = text;
  names.forEach(name => {
    const re = new RegExp('@' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    out = out.replace(re, `<span style="color:var(--pink);font-weight:600;">@${escapeHtml(name)}</span>`);
  });
  return out;
}

function handleCommentInput(input, names){
  const list = document.getElementById('mention-list');
  const val = input.value;
  const cursor = input.selectionStart;
  const upToCursor = val.slice(0, cursor);
  const atMatch = upToCursor.match(/@([^\s@]*)$/);
  if (!atMatch){ list.style.display = 'none'; return; }
  const query = atMatch[1].toLowerCase();
  const matches = names.filter(n => n.toLowerCase().includes(query)).slice(0, 5);
  if (!matches.length){ list.style.display = 'none'; return; }
  list.innerHTML = matches.map(n => `<div style="padding:8px 10px;font-size:13px;color:#fff;cursor:pointer;" onclick="insertMention('${n.replace(/'/g,"\\'")}')">${escapeHtml(n)}</div>`).join('');
  list.style.display = 'block';
}

function insertMention(name){
  const input = document.getElementById('new-comment');
  const val = input.value;
  const cursor = input.selectionStart;
  const upToCursor = val.slice(0, cursor);
  const newUpTo = upToCursor.replace(/@([^\s@]*)$/, '@' + name + ' ');
  input.value = newUpTo + val.slice(cursor);
  document.getElementById('mention-list').style.display = 'none';
  input.focus();
}

const CERT_ORDER = ['bufalo','jabali','sherpa','napas','fotografo','companero'];

function certResultLine(votesForCert){
  const tally = {};
  votesForCert.forEach(v => { tally[v.voted_for_id] = (tally[v.voted_for_id]||0) + 1; });
  const ranked = Object.entries(tally).sort((a,b) => b[1]-a[1]);
  if (!ranked.length) return 'Sin votos todavía';
  const topCount = ranked[0][1];
  const leaders = ranked.filter(([,count]) => count === topCount);
  const leaderNames = leaders.map(([userId]) => {
    const v = votesForCert.find(vv => vv.voted_for_id === userId);
    return escapeHtml(dn(v?.profiles));
  }).join(' y ');
  const others = ranked.length - leaders.length;
  const suffix = leaders.length > 1 ? ' cada uno' : '';
  return `${leaderNames} · ${topCount} voto${topCount===1?'':'s'}${suffix}${others>0?` (+${others} más)`:''}`;
}

      const pct = Math.min(100, Math.round((myVal / ch.target_value) * 100));
      return `
        <div class="card" style="cursor:pointer;" onclick="openChallengeDetail('${ch.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">

          </div>
          <p class="ts" style="color:var(--text-dim2);margin:0 0 6px;">${dateRange} · ${ch.members.length} apuntados</p>
          ${ch.joined ? `
            <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:4px;">
              <span>${ch.scope==='individual'?'Tu progreso':'Progreso del grupo'}</span><span>${myVal.toFixed(0)} / ${ch.target_value} ${metricUnit[ch.metric]||''}</span>

async function submitEditChallenge(challengeId){

  const target_value = parseFloat(document.getElementById('ec-target').value);

const VAPID_PUBLIC_KEY = 'BM1wqCBYwS25cm61TUuBvXM2Rq4aLNlQHWy0j-JKL1zFCbdathyluf0Rf1AftLYpWKjGvQv6zSsjU9ZSoivod2I';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function refreshPushButtonLabel(){
  const label = document.getElementById('push-toggle-label');
  if (!label) return;
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    label.textContent = 'No disponible en este navegador';
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    label.textContent = sub ? 'Desactivar notificaciones' : 'Activar notificaciones';
  } catch(e){
    label.textContent = 'Activar notificaciones';
  }
}

async function togglePushNotifications(){
  const label = document.getElementById('push-toggle-label');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('Tu navegador no soporta notificaciones push. En iPhone, primero tienes que añadir la app a la pantalla de inicio.');
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing){
      await sb.from('push_subscriptions').delete().eq('endpoint', existing.endpoint);
      await existing.unsubscribe();
      label.textContent = 'Activar notificaciones';
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted'){ label.textContent = 'Activar notificaciones'; return; }
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const json = sub.toJSON();
    await sb.from('push_subscriptions').upsert({
      user_id: currentUser.id,
      endpoint: json.endpoint,
      p256dh: json.keys.p256dh,
      auth: json.keys.auth
    }, { onConflict: 'endpoint' });
    label.textContent = 'Desactivar notificaciones';
  } catch(e){
    alert('No se pudo activar: ' + e.message);
  }
}

  const box = document.getElementById('edit-profile-box');
  const btn = document.getElementById('toggle-edit-btn');
  if (box) box.style.display = profileEditOpen ? 'block' : 'none';
  if (btn) btn.innerHTML = profileEditOpen ? svgIcon('close','#fff',13)+' Cerrar edición' : svgIcon('edit','#fff',13)+' Editar perfil';
}

async function saveProfile(){
  const name = document.getElementById('edit-name').value.trim();
  const nickname = document.getElementById('edit-nickname').value.trim();
  const joinDate = document.getElementById('edit-joindate').value;
  if (!name) return;
  await sb.from('profiles').update({ full_name: name, nickname: nickname || null, join_date: joinDate || null }).eq('id', currentUser.id);
  await loadProfile();
  renderPerfil();
}

const SPONSOR_REASONS = [
  'Abandono', 'Ya no me quiere', 'Ha engordado', 'Glovero',
  'Ronca en las rutas', 'Nunca contesta al grupo', 'Se ha pasado a la moto',
  'Rueda muy despacio', 'Prefiere el sofá', 'Motivos personales'
];

function openSponsorRequestModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'sponsor-request-modal';
  bg.innerHTML = `
    <div class="modal">
      <h3>Solicitar cambio de padrino</h3>
      <div class="field"><label>Nuevo padrino propuesto</label>
        <select id="sr-proposed">
          ${profileAllMembers.filter(m=>m.id!==currentProfile?.sponsor_id).map(m => `<option value="${m.id}">${escapeHtml(dn(m))}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Motivo (elige uno o varios)</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">
          ${SPONSOR_REASONS.map((r,i) => `
            <span class="tag" id="sr-reason-chip-${i}" data-reason="${escapeHtml(r)}" onclick="toggleSponsorReason(${i})" style="cursor:pointer;user-select:none;">${escapeHtml(r)}</span>
          `).join('')}
        </div>
      </div>
      <div class="field"><label>Otro motivo (opcional)</label><input id="sr-reason-other" placeholder="Escribe el tuyo si no está en la lista"></div>
      <p class="hint" style="text-align:left;padding:0;">La solicitud pasará al presidente, que la aprobará o rechazará.</p>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn-ghost" style="flex:1;" onclick="document.getElementById('sponsor-request-modal').remove()">Cancelar</button>
        <button class="btn-primary" style="flex:1;" onclick="submitSponsorRequest()">Enviar solicitud</button>
      </div>
      <div id="sr-err" class="err"></div>
    </div>
  `;
  document.body.appendChild(bg);
}

let selectedSponsorReasons = new Set();

function toggleSponsorReason(i){
  const reason = SPONSOR_REASONS[i];
  const chip = document.getElementById(`sr-reason-chip-${i}`);
  if (selectedSponsorReasons.has(reason)){
    selectedSponsorReasons.delete(reason);
    chip.style.background = '';
    chip.style.color = '';
  } else {
    selectedSponsorReasons.add(reason);
    chip.style.background = 'var(--pink)';
    chip.style.color = 'var(--pink-dark)';
  }
}

async function submitSponsorRequest(){
  const proposed_sponsor_id = document.getElementById('sr-proposed').value;
  const other = document.getElementById('sr-reason-other').value.trim();
  const reasons = Array.from(selectedSponsorReasons);
  if (other) reasons.push(other);
  const reason = reasons.join(', ');

  if (!proposed_sponsor_id || !reason){
    document.getElementById('sr-err').textContent = 'Elige un padrino propuesto y al menos un motivo.';
    return;
  }
  const { error } = await sb.from('sponsorship_change_requests').insert({
    requester_id: currentUser.id,
    current_sponsor_id: currentProfile?.sponsor_id || null,
    proposed_sponsor_id,
    reason,
    status: 'pendiente'
  });
  if (error){ document.getElementById('sr-err').textContent = error.message; return; }
  selectedSponsorReasons = new Set();
  document.getElementById('sponsor-request-modal').remove();
  renderPerfil();
}

async function cancelSponsorRequest(requestId){
  if (!confirm('¿Cancelar tu solicitud de cambio de padrino?')) return;
  await sb.from('sponsorship_change_requests').delete().eq('id', requestId);
  renderPerfil();
}

async function startSponsorVote(requestId, hours){
  const endsAt = new Date(Date.now() + hours*3600000).toISOString();
  await sb.from('sponsorship_change_requests').update({ vote_enabled: true, vote_ends_at: endsAt }).eq('id', requestId);
  renderPerfil();
}

async function resolveSponsorRequest(requestId, requesterId, proposedSponsorId, status){
  await sb.from('sponsorship_change_requests').update({
    status, resolved_by: currentUser.id, resolved_at: new Date().toISOString()
  }).eq('id', requestId);

  if (status === 'aprobada' && requesterId && proposedSponsorId){
    await sb.from('profiles').update({ sponsor_id: proposedSponsorId }).eq('id', requesterId);
  }
  renderPerfil();
}

async function uploadAvatar(event){
  const file = event.target.files[0];
  if (!file) return;
  const errBox = document.getElementById('avatar-err');
  errBox.textContent = '';
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/avatar.${ext}`;

  const { error: uploadError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (uploadError){ errBox.textContent = 'Error al subir la foto: ' + uploadError.message; return; }

  const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
  const publicUrl = pub.publicUrl + '?t=' + Date.now(); // evita caché de foto antigua

  const { error: updateError } = await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
  if (updateError){ errBox.textContent = 'Error al guardar la foto: ' + updateError.message; return; }

  await loadProfile();
  renderPerfil();
}

async function submitNewBike(){
  const name = document.getElementById('nb-name').value.trim();
  const type = document.getElementById('nb-type').value;
  if (!name){ document.getElementById('nb-err').textContent = 'Ponle un nombre a la bici.'; return; }
  const { data: existing } = await sb.from('bikes').select('id').eq('user_id', currentUser.id);
  const isFirst = !existing || existing.length === 0;
  const { error } = await sb.from('bikes').insert({ user_id: currentUser.id, name, type, is_main: isFirst });
  if (error){ document.getElementById('nb-err').textContent = error.message; return; }
  document.getElementById('new-bike-modal').remove();
  profileEditOpen = true;
  renderPerfil();
}

async function saveBikeEdit(bikeId){
  const name = document.getElementById(`bike-name-${bikeId}`).value.trim();
  const type = document.getElementById(`bike-type-${bikeId}`).value;
  if (!name) return;
  await sb.from('bikes').update({ name, type }).eq('id', bikeId);
  profileEditOpen = true;
  renderPerfil();
}

async function deleteBike(bikeId){
  if (!confirm('¿Eliminar esta bicicleta?')) return;
  await sb.from('bikes').delete().eq('id', bikeId);
  profileEditOpen = true;
  renderPerfil();
}

async function setMainBike(bikeId){
  await sb.from('bikes').update({ is_main: false }).eq('user_id', currentUser.id);
  await sb.from('bikes').update({ is_main: true }).eq('id', bikeId);
  profileEditOpen = true;
  renderPerfil();
}

  bg.className = 'modal-bg';
  bg.id = 'new-ride-modal';
  bg.innerHTML = `

function closeModal(){ document.getElementById('new-ride-modal')?.remove(); }

let nrLat = null, nrLng = null;
function useMyLocation(){
  const status = document.getElementById('nr-loc-status');
  if (!navigator.geolocation){ status.textContent = 'Tu navegador no permite compartir ubicación.'; return; }
  status.textContent = 'Buscando ubicación...';
  navigator.geolocation.getCurrentPosition(
    pos => { nrLat = pos.coords.latitude; nrLng = pos.coords.longitude; status.innerHTML = 'Ubicación guardada ' + svgIcon('check','#8fe0a8',11); status.style.color = '#8fe0a8'; },
    () => { status.textContent = 'No se pudo obtener la ubicación.'; }
  );
}

function parseGPX(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const pts = Array.from(doc.getElementsByTagName('trkpt')).map(pt => ({
    lat: parseFloat(pt.getAttribute('lat')),
    lng: parseFloat(pt.getAttribute('lon')),
    ele: pt.getElementsByTagName('ele')[0] ? parseFloat(pt.getElementsByTagName('ele')[0].textContent) : null
  }));
  if (!pts.length) return null;
  const toRad = d => d * Math.PI / 180;
  let distanceKm = 0, elevGain = 0;
  for (let i = 1; i < pts.length; i++){
    const a = pts[i-1], b = pts[i];
    const R = 6371;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
    distanceKm += R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
    if (a.ele != null && b.ele != null && b.ele > a.ele) elevGain += (b.ele - a.ele);
  }
  return { points: pts, distanceKm, elevGain };
}

async function submitNewRide(){
  const name = document.getElementById('nr-name').value.trim();
  const ride_date = document.getElementById('nr-date').value;
  const ride_time = document.getElementById('nr-time').value || null;
  const meeting_point = document.getElementById('nr-meeting').value.trim() || null;
  const kmVal = document.getElementById('nr-km').value;
  const distance_km = kmVal ? parseFloat(kmVal) : null;

  if (!name || !ride_date){
    document.getElementById('nr-err').textContent = 'Nombre y fecha son obligatorios.';
    return;
  }

  const { error } = await sb.from('rides').insert({
    name, ride_date, ride_time, meeting_point, distance_km,
    meeting_lat: nrLat, meeting_lng: nrLng,
    created_by: currentUser.id, status: 'programada'
  });
  if (error){ document.getElementById('nr-err').textContent = error.message; return; }

  nrLat = null; nrLng = null;
  closeModal();
  activeTab = 'calendario';
  renderApp();
}

// ---------------- helpers ----------------
function dn(p){
  if (!p) return '';
  return (p.nickname && p.nickname.trim()) ? p.nickname : (p.full_name || '');
}

function escapeHtml(str){
  if (!str) return '';
  return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function formatDate(d){
  if (!d) return '';
  const date = new Date(d+'T00:00:00');
  return date.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' });
}
