<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Biciconamigos</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0A1128;
    --navy-2:rgba(255,255,255,0.06);
    --navy-border:rgba(255,255,255,0.1);
    --pink:#D4537E;
    --pink-dark:#4B1528;
    --pink-mid:#72243E;
    --text:#ffffff;
    --text-dim:rgba(255,255,255,0.55);
    --text-dim2:rgba(255,255,255,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;padding:24px 12px;background:#EEEEF0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;}
  button{cursor:pointer;font-family:inherit;border:none;}
  input,select,textarea{font-family:inherit;}
  .app{max-width:420px;width:100%;height:calc(100vh - 48px);background:#F4F4F5;border-radius:20px;padding:10px;display:flex;}
  .phone{background:var(--navy);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0;}
  @media (max-width:480px){
    body{padding:0;}
    .app{max-width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;}
    .phone{border-radius:0;}
  }
  .header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:0.5px solid var(--navy-border);min-height:76px;flex-shrink:0;}
  .logo-img{height:64px;width:auto;display:block;}
  .header-title{font-weight:600;font-size:15px;color:var(--text);}
  .header-user{margin-left:auto;font-size:12px;color:var(--text-dim);cursor:pointer;}
  .content{flex:1;padding:14px 16px;overflow-y:auto;}
  .card{background:var(--navy-2);border-radius:10px;padding:12px;margin-bottom:10px;}
  .label-sm{font-size:11px;color:var(--text-dim);margin:0 0 4px;text-transform:uppercase;letter-spacing:0.03em;}
  .section-title{font-size:13px;font-weight:600;color:var(--text-dim);margin:0 0 8px;}
  .btn-primary{background:var(--pink);color:var(--pink-dark);font-weight:600;font-size:13px;padding:9px 14px;border-radius:8px;}
  .btn-ghost{background:transparent;color:var(--text-dim);font-size:13px;padding:9px 14px;border-radius:8px;border:0.5px solid var(--navy-border);}
  .btn-dark{background:var(--navy);color:#fff;font-size:12px;padding:6px 12px;border-radius:8px;}
  input,textarea,select{background:rgba(255,255,255,0.08);border:0.5px solid var(--navy-border);color:var(--text);border-radius:8px;padding:9px 10px;font-size:13px;width:100%;}
  input::placeholder,textarea::placeholder{color:var(--text-dim2);}
  .nav{display:flex;border-top:0.5px solid var(--navy-border);flex-shrink:0;}
  .navicon{font-size:16px;line-height:1;}
  .navbtn{flex:1;background:transparent;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-dim);}
  .navbtn.active{color:var(--pink);}
  .navbtn i{font-size:18px;}
  .navbtn span{font-size:10px;}
  .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--navy-border);}
  .row:last-child{border-bottom:none;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--navy-2);flex-shrink:0;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .stat-box{background:var(--navy-2);border-radius:10px;padding:10px 12px;}
  .stat-val{font-size:18px;font-weight:600;margin:0;color:var(--text);}
  .hint{font-size:12px;color:var(--text-dim);text-align:center;padding:20px 10px;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--navy);border-radius:16px 16px 0 0;padding:18px 16px 22px;width:100%;max-width:420px;}
  .modal h3{color:#fff;font-size:15px;margin:0 0 12px;}
  .field{margin-bottom:10px;}
  .field label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;}
  .fab{position:absolute;bottom:70px;right:16px;width:44px;height:44px;border-radius:50%;background:var(--pink);color:var(--pink-dark);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
  .auth-box{padding:40px 20px;}
  .auth-box h2{color:#fff;font-size:18px;margin-bottom:4px;}
  .auth-box p.sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
  .err{color:#ff8fa3;font-size:12px;margin-top:6px;}
  .tag{display:inline-block;font-size:11px;background:var(--navy-2);color:var(--text-dim);padding:3px 8px;border-radius:6px;margin-right:4px;}
</style>
</head>

  <div class="hint">Cargando...</div>

let currentProfile = null;
let activeTab = 'inicio';

const phone = document.getElementById('phone');

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    currentUser = session.user;
    await loadProfile();
    renderApp();
  } else {
    renderAuth();
  }
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN'){
    currentUser = session.user;
    loadProfile().then(renderApp);
  }
  if (event === 'SIGNED_OUT'){
    currentUser = null; currentProfile = null;
    renderAuth();
  }
});

async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = data;
}

async function doSignIn(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) document.getElementById('auth-err').textContent = error.message;
}

async function doSignUp(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const { error } = await sb.auth.signUp({ email, password });
  if (error) { document.getElementById('auth-err').textContent = error.message; return; }
  document.getElementById('auth-err').style.color = '#8fe0a8';
  document.getElementById('auth-err').textContent = 'Cuenta creada. Ya puedes entrar.';
}

async function signOut(){ await sb.auth.signOut(); }

function setTab(tab){ activeTab = tab; renderApp(); }

function renderTab(){
  if (activeTab === 'inicio') renderInicio();
  else if (activeTab === 'calendario') renderCalendario();
  else if (activeTab === 'clasificacion') renderClasificacion();
  else if (activeTab === 'perfil') renderPerfil();
}

// ---------------- INICIO ----------------
async function renderInicio(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="hint">Cargando...</div>`;

  const today = new Date().toISOString().slice(0,10);
  const { data: nextRides } = await sb.from('rides')
    .select('*, ride_participants(user_id, status)')
    .in('status', ['programada','en_curso'])
    .gte('ride_date', today)
    .order('ride_date', { ascending: true })
    .limit(1);

  const { data: recentRides } = await sb.from('rides')
    .select('name, created_at, created_by, profiles:created_by(full_name)')
    .order('created_at', { ascending: false })
    .limit(5);

  const { data: myParticipations } = await sb.from('ride_participants')
    .select('ride_id, rides(distance_km, status)')
    .eq('user_id', currentUser.id)
    .eq('status', 'confirmado');

  const myKm = (myParticipations||[])
    .filter(p => p.rides && p.rides.status === 'finalizada')
    .reduce((sum,p) => sum + (p.rides.distance_km || 0), 0);
  const myRidesCount = (myParticipations||[]).filter(p => p.rides && p.rides.status === 'finalizada').length;

  let nextRideHtml = `<div class="card"><p class="hint" style="padding:6px;">No hay ninguna salida programada todavía.<br><button class="btn-primary" style="margin-top:8px;" onclick="openNewRideModal()">Crear la primera</button></p></div>`;
  if (nextRides && nextRides.length){
    const r = nextRides[0];
    const mine = (r.ride_participants||[]).find(p => p.user_id === currentUser.id);
    const confirmedCount = (r.ride_participants||[]).filter(p => p.status==='confirmado').length;
    nextRideHtml = `
      <div class="card" style="background:var(--pink);">
        <p class="label-sm" style="color:${"#4B1528"};">Próxima salida</p>
        <p style="font-size:16px;font-weight:600;margin:0 0 6px;color:#4B1528;">${escapeHtml(r.name)}</p>
        <div style="display:flex;gap:12px;font-size:12px;color:#72243E;margin-bottom:10px;flex-wrap:wrap;">
          <span>📅 ${formatDate(r.ride_date)}${r.ride_time? ' · '+r.ride_time.slice(0,5):''}</span>
          ${r.distance_km? `<span>📍 ${r.distance_km} km${r.elevation_m? ' · '+r.elevation_m+' m+':''}</span>`:''}
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:12px;color:#72243E;">${confirmedCount} confirmados</span>
          ${mine && mine.status==='confirmado'
            ? `<button class="btn-dark" onclick="setAttendance('${r.id}','no_asistira')">✓ Asistiré</button>`
            : `<button class="btn-dark" onclick="setAttendance('${r.id}','confirmado')">Confirmar asistencia</button>`}
        </div>
      </div>`;
  }

  let activityHtml = '<p class="hint">Sin actividad todavía.</p>';
  if (recentRides && recentRides.length){
    activityHtml = recentRides.map(r => `
      <div class="row"><div class="avatar"></div><span style="font-size:13px;color:#fff;">${escapeHtml(r.profiles?.full_name||'Alguien')} ha registrado <b>${escapeHtml(r.name)}</b></span></div>
    `).join('');
  }

  content.innerHTML = `
    ${nextRideHtml}
    <p class="section-title">Actividad reciente</p>
    <div class="card" style="padding:4px 12px;">${activityHtml}</div>
    <p class="section-title">Mi resumen</p>
    <div class="stat-grid">
      <div class="stat-box"><p class="label-sm">Km (finalizadas)</p><p class="stat-val">${myKm.toFixed(0)}</p></div>
      <div class="stat-box"><p class="label-sm">Salidas</p><p class="stat-val">${myRidesCount}</p></div>
    </div>
  `;
}

async function setAttendance(rideId, status){
  await sb.from('ride_participants').upsert({ ride_id: rideId, user_id: currentUser.id, status }, { onConflict: 'ride_id,user_id' });
  renderInicio();
}

// ---------------- CALENDARIO ----------------
async function renderCalendario(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="hint">Cargando...</div>`;
  const { data: rides, error } = await sb.from('rides')
    .select('*')
    .order('ride_date', { ascending: false })
    .limit(30);

  if (error){ content.innerHTML = `<p class="hint">Error cargando salidas: ${error.message}</p>`; return; }

  const statusLabel = { programada:'Programada', en_curso:'En curso', finalizada:'Finalizada', archivada:'Archivada' };

  content.innerHTML = `
    <p class="section-title">Salidas</p>
    ${(rides||[]).map(r => `
      <div class="card">
        <p style="font-size:13px;font-weight:600;margin:0 0 2px;color:#fff;">${escapeHtml(r.name)}</p>
        <p style="font-size:12px;color:var(--text-dim);margin:0;">
          ${formatDate(r.ride_date)}${r.distance_km? ' · '+r.distance_km+' km':''} · ${statusLabel[r.status]||r.status}
        </p>
      </div>
    `).join('') || '<p class="hint">Todavía no hay salidas. Toca + para crear la primera.</p>'}
  `;
}

// ---------------- CLASIFICACIÓN ----------------
async function renderClasificacion(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="hint">Cargando...</div>`;

  const { data: participations } = await sb.from('ride_participants')
    .select('user_id, status, profiles(full_name), rides(distance_km, status)')
    .eq('status', 'confirmado');

  const totals = {};
  (participations||[]).forEach(p => {
    if (!p.rides || p.rides.status !== 'finalizada') return;
    const key = p.user_id;
    if (!totals[key]) totals[key] = { name: p.profiles?.full_name || '—', km: 0 };
    totals[key].km += p.rides.distance_km || 0;
  });
  const ranking = Object.values(totals).sort((a,b) => b.km - a.km);

  const { data: certs } = await sb.from('certificates').select('code,name,emoji').order('name');

  content.innerHTML = `
    <p class="section-title">Ranking temporada</p>
    <div class="card" style="padding:4px 12px;">
      ${ranking.length ? ranking.map((r,i) => `
        <div class="row">
          <span style="font-size:13px;font-weight:600;width:16px;color:#fff;">${i+1}</span>
          <div class="avatar"></div>
          <span style="font-size:13px;flex:1;color:#fff;">${escapeHtml(r.name)}</span>
          <span style="font-size:12px;color:var(--text-dim);">${r.km.toFixed(0)} km</span>
        </div>
      `).join('') : '<p class="hint">Todavía no hay salidas finalizadas con kilómetros.</p>'}
    </div>
    <p class="section-title">Certificados del club</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${(certs||[]).map(c => `<span class="tag">${c.emoji} ${escapeHtml(c.name)}</span>`).join('') || '<p class="hint">Sin certificados definidos todavía.</p>'}
    </div>
  `;
}

// ---------------- PERFIL ----------------
async function renderPerfil(){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="hint">Cargando...</div>`;

  const [
    { data: sponsor },
    { data: godchildren },
    { data: roles },
    { data: bikes },
    { data: participations },
    { data: certVotes },
    { data: allCerts },
    { data: awards },
    { data: firstRideRow },
    { data: allMembers }
  ] = await Promise.all([
    currentProfile?.sponsor_id
      ? sb.from('profiles').select('full_name').eq('id', currentProfile.sponsor_id).single()
      : Promise.resolve({ data: null }),
    sb.from('profiles').select('full_name').eq('sponsor_id', currentUser.id),
    sb.from('user_roles').select('role').eq('user_id', currentUser.id),
    sb.from('bikes').select('*').eq('user_id', currentUser.id).order('created_at'),
    sb.from('ride_participants').select('rides(distance_km, elevation_m, duration_minutes, status, ride_date)').eq('user_id', currentUser.id).eq('status', 'confirmado'),
    sb.from('certificate_votes').select('certificate_id, certificates(code, name, emoji)').eq('voted_for_id', currentUser.id),
    sb.from('certificates').select('*').order('name'),
    sb.from('season_awards').select('votes_count, seasons(name, year), certificates(name, emoji)').eq('user_id', currentUser.id).order('awarded_at', { ascending: false }),
    sb.from('ride_participants').select('rides(ride_date, name)').eq('user_id', currentUser.id).eq('status', 'confirmado').order('rides(ride_date)', { ascending: true }).limit(1),
    sb.from('profiles').select('id, full_name').neq('id', currentUser.id).order('full_name')
  ]);

  // Cargo
  const roleList = (roles||[]).map(r=>r.role);
  const cargo = roleList.includes('president') ? 'Presidente' : roleList.includes('admin') ? 'Administrador' : 'Miembro';

  // Estadísticas
  const finished = (participations||[]).map(p=>p.rides).filter(r => r && r.status === 'finalizada');
  const totalKm = finished.reduce((s,r)=>s+(r.distance_km||0),0);
  const totalElev = finished.reduce((s,r)=>s+(r.elevation_m||0),0);
  const totalMin = finished.reduce((s,r)=>s+(r.duration_minutes||0),0);
  const totalHoras = totalMin/60;
  const velMedia = totalHoras>0 ? (totalKm/totalHoras) : 0;

  // Certificados ganados (conteo de votos recibidos, agrupado)
  const certCounts = {};
  (certVotes||[]).forEach(v => {
    const c = v.certificates;
    if (!c) return;
    certCounts[c.code] = certCounts[c.code] || { name:c.name, emoji:c.emoji, count:0 };
    certCounts[c.code].count++;
  });
  const certCountsArr = Object.values(certCounts).sort((a,b)=>b.count-a.count);

  // Línea temporal (calculada, no almacenada)
  const timeline = [];
  if (currentProfile?.join_date) timeline.push({ date: currentProfile.join_date, text: 'Entrada en Biciconamigos' });
  const firstRide = firstRideRow && firstRideRow[0] && firstRideRow[0].rides;
  if (firstRide) timeline.push({ date: firstRide.ride_date, text: `Primera salida: ${firstRide.name}` });
  (awards||[]).forEach(a => {
    timeline.push({ date: `${a.seasons?.year||''}`, text: `${a.certificates?.emoji||''} Elegido ${a.certificates?.name} de la temporada ${a.seasons?.name||''}`, highlight:true });
  });
  timeline.sort((a,b)=> String(a.date).localeCompare(String(b.date)));

  const mainBike = (bikes||[]).find(b=>b.is_main);
  const bikeTypeLabel = { carretera:'Carretera', gravel:'Gravel', mtb:'MTB' };

  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
      <div style="position:relative;width:56px;height:56px;flex-shrink:0;">
        <div id="avatar-box" style="width:56px;height:56px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--pink-dark);overflow:hidden;font-size:18px;">
          ${currentProfile?.avatar_url ? `<img src="${currentProfile.avatar_url}" style="width:100%;height:100%;object-fit:cover;">` : (currentProfile?.full_name||'?').slice(0,2).toUpperCase()}
        </div>
        <label style="position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--navy);border:2px solid var(--pink);display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <span style="font-size:10px;">📷</span>
          <input type="file" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
        </label>
      </div>
      <div>
        <p style="font-size:15px;font-weight:600;margin:0;color:#fff;">${escapeHtml(currentProfile?.full_name||'')}</p>
        <p style="font-size:12px;color:var(--text-dim);margin:0;">Miembro desde ${currentProfile?.join_date||'—'} · <span class="tag" style="margin:0;">${cargo}</span></p>
      </div>
    </div>
    <div id="avatar-err" class="err"></div>

    <div class="stat-grid">
      <div class="stat-box"><p class="label-sm">Padrino</p><p class="stat-val" style="font-size:14px;">${sponsor?.full_name || '— sin asignar'}</p></div>
      <div class="stat-box"><p class="label-sm">Ahijados</p><p class="stat-val" style="font-size:14px;">${(godchildren||[]).map(g=>g.full_name).join(', ') || '—'}</p></div>
    </div>
    <p class="hint" style="text-align:left;padding:0 0 10px;">Los ahijados no se eligen aquí: aparecen solos en cuanto otro socio te pone como padrino. Aquí solo puedes cambiar el tuyo.</p>
    <p class="section-title">Cambiar padrino</p>
    <div class="card">
      <div class="field">
        <select id="edit-sponsor">
          <option value="">— sin asignar —</option>
          ${(allMembers||[]).map(m => `<option value="${m.id}" ${currentProfile?.sponsor_id===m.id?'selected':''}>${escapeHtml(m.full_name)}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" onclick="saveSponsor()">Guardar padrino</button>
    </div>

    <p class="section-title">Estadísticas (salidas finalizadas)</p>
    <div class="stat-grid">
      <div class="stat-box"><p class="label-sm">Km totales</p><p class="stat-val">${totalKm.toFixed(0)}</p></div>
      <div class="stat-box"><p class="label-sm">Desnivel</p><p class="stat-val">${totalElev.toFixed(0)} m</p></div>
      <div class="stat-box"><p class="label-sm">Salidas</p><p class="stat-val">${finished.length}</p></div>
      <div class="stat-box"><p class="label-sm">Horas</p><p class="stat-val">${totalHoras.toFixed(1)}</p></div>
      <div class="stat-box"><p class="label-sm">Vel. media</p><p class="stat-val">${velMedia.toFixed(1)} km/h</p></div>
    </div>

    <p class="section-title">Mis bicicletas ${mainBike? '· principal: '+escapeHtml(mainBike.name):''}</p>
    <div class="card" style="padding:4px 12px;">
      ${(bikes||[]).length ? bikes.map(b => `
        <div class="row">
          <span style="color:${b.is_main?'var(--pink)':'var(--text-dim)'};">🚲</span>
          <span style="font-size:13px;flex:1;color:#fff;">${escapeHtml(b.name)} <span class="tag" style="margin-left:4px;">${bikeTypeLabel[b.type]||b.type}</span></span>
          ${b.is_main ? '<span style="font-size:11px;color:var(--pink);">★ principal</span>' : `<button class="btn-ghost" style="font-size:11px;padding:4px 8px;" onclick="setMainBike('${b.id}')">Hacer principal</button>`}
        </div>
      `).join('') : '<p class="hint">Todavía no tienes bicicletas registradas.</p>'}
    </div>
    <button class="btn-ghost" style="margin-bottom:14px;" onclick="openNewBikeModal()">+ Añadir bicicleta</button>

    <p class="section-title">Certificados recibidos</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
      ${certCountsArr.length ? certCountsArr.map(c => `<span class="tag">${c.emoji} ${escapeHtml(c.name)} × ${c.count}</span>`).join('') : '<p class="hint">Todavía no has recibido ningún voto.</p>'}
    </div>

    <p class="section-title">Palmarés</p>
    <div class="card" style="padding:4px 12px;">
      ${(awards||[]).length ? awards.map(a => `
        <div class="row"><span style="font-size:13px;color:var(--text-dim);width:50px;">${a.seasons?.year||''}</span><span style="font-size:13px;color:#fff;">${a.certificates?.emoji||''} ${escapeHtml(a.certificates?.name||'')}</span></div>
      `).join('') : '<p class="hint">Todavía sin títulos oficiales de temporada.</p>'}
    </div>

    <p class="section-title">Línea temporal</p>
    <div style="display:flex;flex-direction:column;margin-bottom:14px;">
      ${timeline.length ? timeline.map(t => `
        <div style="display:flex;gap:10px;padding:6px 0;">
          <span style="font-size:11px;color:var(--text-dim2);width:70px;flex-shrink:0;">${t.date}</span>
          <span style="font-size:12px;${t.highlight?'font-weight:600;color:var(--pink);':'color:#fff;'}">${t.text}</span>
        </div>
      `).join('') : '<p class="hint">Todavía no hay hitos que mostrar.</p>'}
    </div>

    <p class="section-title">Editar perfil</p>
    <div class="card">
      <div class="field"><label>Nombre</label><input id="edit-name" value="${escapeHtml(currentProfile?.full_name||'')}"></div>
      <button class="btn-primary" onclick="saveProfile()">Guardar</button>
    </div>
  `;
}

async function saveProfile(){
  const name = document.getElementById('edit-name').value.trim();
  if (!name) return;
  await sb.from('profiles').update({ full_name: name }).eq('id', currentUser.id);
  await loadProfile();
  renderPerfil();
}

async function saveSponsor(){
  const select = document.getElementById('edit-sponsor');
  const sponsorId = select.value || null;
  await sb.from('profiles').update({ sponsor_id: sponsorId }).eq('id', currentUser.id);
  await loadProfile();
  renderPerfil();
}

async function uploadAvatar(event){
  const file = event.target.files[0];
  if (!file) return;
  const errBox = document.getElementById('avatar-err');
  errBox.textContent = '';
  const ext = file.name.split('.').pop();
  const path = `${currentUser.id}/avatar.${ext}`;

  const { error: uploadError } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (uploadError){ errBox.textContent = 'Error al subir la foto: ' + uploadError.message; return; }

  const { data: pub } = sb.storage.from('avatars').getPublicUrl(path);
  const publicUrl = pub.publicUrl + '?t=' + Date.now(); // evita caché de foto antigua

  const { error: updateError } = await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
  if (updateError){ errBox.textContent = 'Error al guardar la foto: ' + updateError.message; return; }

  await loadProfile();
  renderPerfil();
}

function openNewBikeModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'new-bike-modal';
  bg.innerHTML = `
    <div class="modal">
      <h3>Nueva bicicleta</h3>
      <div class="field"><label>Nombre</label><input id="nb-name" placeholder="La roja"></div>
      <div class="field"><label>Tipo</label>
        <select id="nb-type">
          <option value="carretera">Carretera</option>
          <option value="gravel">Gravel</option>
          <option value="mtb">MTB</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn-ghost" style="flex:1;" onclick="document.getElementById('new-bike-modal').remove()">Cancelar</button>
        <button class="btn-primary" style="flex:1;" onclick="submitNewBike()">Añadir</button>
      </div>
      <div id="nb-err" class="err"></div>
    </div>
  `;
  document.body.appendChild(bg);
}

async function submitNewBike(){
  const name = document.getElementById('nb-name').value.trim();
  const type = document.getElementById('nb-type').value;
  if (!name){ document.getElementById('nb-err').textContent = 'Ponle un nombre a la bici.'; return; }
  const { data: existing } = await sb.from('bikes').select('id').eq('user_id', currentUser.id);
  const isFirst = !existing || existing.length === 0;
  const { error } = await sb.from('bikes').insert({ user_id: currentUser.id, name, type, is_main: isFirst });
  if (error){ document.getElementById('nb-err').textContent = error.message; return; }
  document.getElementById('new-bike-modal').remove();
  renderPerfil();
}

async function setMainBike(bikeId){
  await sb.from('bikes').update({ is_main: false }).eq('user_id', currentUser.id);
  await sb.from('bikes').update({ is_main: true }).eq('id', bikeId);
  renderPerfil();
}

// ---------------- NUEVA SALIDA (modal) ----------------
function openNewRideModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'new-ride-modal';
  bg.innerHTML = `
    <div class="modal">
      <h3>Nueva salida</h3>
      <div class="field"><label>Nombre</label><input id="nr-name" placeholder="Puerto de Canencia"></div>
      <div class="field"><label>Fecha</label><input id="nr-date" type="date"></div>
      <div class="field"><label>Hora</label><input id="nr-time" type="time"></div>
      <div class="field"><label>Punto de encuentro</label><input id="nr-meeting" placeholder="Rotonda de siempre"></div>
      <div class="field"><label>Km previstos (opcional)</label><input id="nr-km" type="number" step="0.1"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn-ghost" style="flex:1;" onclick="closeModal()">Cancelar</button>
        <button class="btn-primary" style="flex:1;" onclick="submitNewRide()">Crear</button>
      </div>
      <div id="nr-err" class="err"></div>
    </div>
  `;
  document.body.appendChild(bg);
}
function closeModal(){ document.getElementById('new-ride-modal')?.remove(); }

async function submitNewRide(){
  const name = document.getElementById('nr-name').value.trim();
  const ride_date = document.getElementById('nr-date').value;
  const ride_time = document.getElementById('nr-time').value || null;
  const meeting_point = document.getElementById('nr-meeting').value.trim() || null;
  const kmVal = document.getElementById('nr-km').value;
  const distance_km = kmVal ? parseFloat(kmVal) : null;

  if (!name || !ride_date){
    document.getElementById('nr-err').textContent = 'Nombre y fecha son obligatorios.';
    return;
  }
  const { error } = await sb.from('rides').insert({
    name, ride_date, ride_time, meeting_point, distance_km,
    created_by: currentUser.id, status: 'programada'
  });
  if (error){ document.getElementById('nr-err').textContent = error.message; return; }
  closeModal();
  activeTab = 'calendario';
  renderApp();
}

// ---------------- helpers ----------------
function escapeHtml(str){
  if (!str) return '';
  return str.replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function formatDate(d){
  if (!d) return '';
  const date = new Date(d+'T00:00:00');
  return date.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' });
}

init();
</script>
